<body>
<header class="site-header">
  <div class="brand"><div class="brand-symbol" aria-hidden="true">▦</div><div><strong>Synagogue Material Studio</strong><small id="brandSub">הדמיית חיפוי קירות</small></div></div>
  <nav class="languages" aria-label="Language"><button type="button" data-lang="he" aria-pressed="true">עברית</button><button type="button" data-lang="en">English</button><button type="button" data-lang="ru">Русский</button></nav>
</header>
<main class="container">
 <section class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="mainTitle"></h1><p id="subtitle"></p></section>
 <div id="errorBox" class="error-box" hidden role="alert"></div>
 <div class="workspace">
  <section class="view-card" aria-label="Preview">
   <div class="card-heading"><strong id="previewTitle"></strong><span id="sceneChip" class="chip"></span></div>
   <div class="scene-stage" id="stage"><canvas id="renderCanvas" width="1536" height="864" aria-label="Rendered room"></canvas><div id="emptyScene" class="empty-scene" hidden><span class="empty-icon">▧</span><b id="emptyTitle"></b><p id="emptyHelp"></p><button type="button" id="emptyUpload" class="primary"></button></div></div>
   <div class="preview-actions"><button type="button" id="compareBtn" class="ghost"></button><button type="button" id="exportBtn" class="primary"></button></div>
   <p id="renderNotice" class="accuracy"></p>
  </section>
  <aside class="controls">
   <section class="panel"><h2><span class="step">01</span><span id="sceneSection"></span></h2><label for="maskProfile" id="maskLabel" class="field-label"></label><select id="maskProfile"></select><div id="maskStats" class="hint"></div><div class="profile-photo"><label id="photoLabel" class="field-label"></label><div class="photo-buttons"><button type="button" id="useDemo" class="secondary"></button><button type="button" id="uploadBtn" class="secondary"></button></div><input id="photoFile" type="file" accept="image/png,image/jpeg,image/webp" hidden/><div id="photoStatus" class="hint"></div></div></section>
   <section class="panel"><h2><span class="step">02</span><span id="scenarioSection"></span></h2><div id="scenarioOptions" class="scenario-grid"></div></section>
   <section class="panel"><h2><span class="step">03</span><span id="materialSection"></span></h2><div id="materialSelectors"></div><div id="productCard" class="product-card"></div></section>
   <details class="advanced" id="advanced"><summary id="advancedTitle"></summary><div class="advanced-inner"><div class="control-line"><label id="opacityLabel" for="opacity"></label><input type="range" id="opacity" min="0.3" max="1" step="0.05" value="0.93"/><span id="opacityValue"></span></div><div class="control-line"><label id="lightingLabel" for="lighting"></label><input type="range" id="lighting" min="0" max="0.9" step="0.05" value="0.25"/><span id="lightingValue"></span></div><div class="control-line"><label id="scaleLabel" for="scale"></label><input type="range" id="scale" min="0.4" max="2.5" step="0.05" value="1"/><span id="scaleValue"></span></div><label class="checkline"><input type="checkbox" id="protectObjects" checked/><span id="protectLabel"></span></label><label class="checkline"><input type="checkbox" id="showMasks"/><span id="showMasksLabel"></span></label><label class="checkline"><input type="checkbox" id="inscriptionEnabled"/><span id="inscriptionEnabledLabel"></span></label><input id="inscriptionText" type="text" dir="auto" value="" placeholder="ברוך הבא" maxlength="60"/>
    <div class="mask-edit"><h3 id="maskEditorTitle"></h3><p id="editorHelp" class="hint"></p><div class="edit-tools"><select id="drawMode"><option value="view" id="drawView"></option><option value="top" id="drawTop"></option><option value="bottom" id="drawBottom"></option><option value="arkTop" id="drawArkTop"></option><option value="arkFace" id="drawArkFace"></option><option value="protect" id="drawProtected"></option></select><button type="button" id="finishPolygon"></button><button type="button" id="cancelPolygon"></button></div><div id="maskList" class="mask-list"></div></div>
    <div class="save-actions"><button type="button" id="saveProject"></button><button type="button" id="loadProject"></button><input id="projectFile" type="file" accept="application/json,.json" hidden/></div>
   </div></details>
  </aside>
 </div>
 <details class="catalog-section" id="catalogSection"><summary id="catalogTitle"></summary><div id="catalogGrid" class="catalog-grid"></div></details>
 <footer><span id="footerText"></span><a href="https://www.kalkir.co.il/" rel="noopener noreferrer" target="_blank">Kalkir ↗</a> · <a href="https://github.com/dzzk-r/synagogue-material-studio" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer>
</main>

function renderProduct(){let t=tr(),groups=groupNames(),id=state.materials[groups[0]]||'yerushalmi';let m=catalog.find(x=>x.id===id)||catalog[0];const card=$('productCard');card.replaceChildren();if(!m){card.hidden=true;return}card.hidden=false;const img=document.createElement('img');img.alt=m.he;img.loading='lazy';img.referrerPolicy='no-referrer';img.src=m.texturePath;const remote=new Image();remote.onload=()=>{if(card.dataset.model===m.id)img.src=m.photo};remote.onerror=()=>{};remote.src=m.photo;card.dataset.model=m.id;card.append(img);const text=document.createElement('div');text.className='info';const h=document.createElement('b');h.textContent=m.he;text.append(h);const desc=document.createElement('div');desc.textContent=`${t.dimensions}: ${m.dimensions} · ${t.coverage}: ${m.coverage_m2} m² · ${t.weight}: ${m.weight_kg} kg`;text.append(desc);const sku=document.createElement('small');sku.textContent=t.sku;text.append(sku);const link=document.createElement('a');link.href=m.url;link.textContent=t.source;link.target='_blank';link.rel='noopener noreferrer';text.append(link);const tex=document.createElement('small');tex.textContent=official[id]?t.textureOfficial:t.textureApprox;text.append(tex);card.append(text)}

function pathFor(points){let path=new Path2D();if(!points?.length)return path;path.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)path.lineTo(points[i][0],points[i][1]);path.closePath();return path}
function paintRegion(region,p,img){const tile=official[state.materials[region.group]]||tiles[state.materials[region.group]];if(!tile)return;let mask=pathFor(region.points);ctx.save();ctx.clip(mask);const m=catalog.find(x=>x.id===state.materials[region.group]);let raw=parseFloat(m?.dimensions?.match(/\d+/)?.[0]||130);let px=state.scale*150*raw/100;const pattern=ctx.createPattern(tile,'repeat');if(pattern&&pattern.setTransform)pattern.setTransform(new DOMMatrix().scale(px/tile.naturalWidth,px*(.76*raw/130)/(tile.naturalHeight||400)));ctx.globalAlpha=state.opacity;ctx.fillStyle=pattern||'#d9c5a3';ctx.fillRect(0,0,p.width,p.height);

if(state.inscriptionEnabled&&enabled.has('arkTop')&&state.inscription.trim()){let reg=p.masks.find(o=>o.group==='arkTop');if(reg){const xs=reg.points.map(x=>x[0]),ys=reg.points.map(x=>x[1]);let mid=(Math.min(...xs)+Math.max(...xs))/2,y=(Math.min(...ys)+Math.max(...ys))/2;ctx.save();ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+Math.round(p.height/19)+'px serif';ctx.shadowColor='#3b2413';ctx.shadowBlur=3;ctx.lineWidth=1;ctx.strokeStyle='#5b4124';ctx.fillStyle='#e3c68a';ctx.strokeText(state.inscription,mid,y,Math.max(...xs)-Math.min(...xs)-20);ctx.fillText(state.inscription,mid,y,Math.max(...xs)-Math.min(...xs)-20);ctx.restore()}}}

async function changeProfile(id){if(!profiles[id])return;state.profileId=id;const profile=current();canvas.width=profile.width;canvas.height=profile.height;state.draft=[];if(!state.photos[id]){const cached=await cachedFile(id);if(cached){try{let uri=URL.createObjectURL(cached);let img=await imageLoad(uri);setPhotoForProfile(id,img,'local',cached.name||'local image')}catch(e){}}else if(profile.demo){try{let img=await imageLoad(profile.demo);setPhotoForProfile(id,img,'demo','clean-master example')}catch(e){}}}
$('maskProfile').value=id;refreshStatus();scheduleDraw();}
async function loadLocalFile(file){if(!file)return;if(!file.type.startsWith('image/')){toast(tr().badFile);return}let guess=Object.values(profiles).find(p=>file.name.includes(p.sourceHint));if(guess&&guess.id!==state.profileId){state.profileId=guess.id;$('maskProfile').value=guess.id}let uri=URL.createObjectURL(file);try{let img=await imageLoad(uri);setPhotoForProfile(state.profileId,img,'local',file.name);persistFile(state.profileId,file);toast(tr().loaded)}catch(e){toast(tr().badFile)}finally{setTimeout(()=>URL.revokeObjectURL(uri),45000)}}
async function probeOfficial(m){if(official[m.id])return;try{const img=await Promise.race([imageLoad(m.photo,true),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),4300))]); // Catalog image: not a geometric panel scan.
 official[m.id]=img;renderProduct();scheduleDraw();}catch(e){} }
function refreshMaskOutline(){renderMaskList();scheduleDraw()}
function renderMaskList(){const p=current(),list=$('maskList');list.replaceChildren();if(!p)return;const t=tr();for(const [type,arr] of [['editable',p.masks],['protected',p.protected]]){for(let i=0;i<arr.length;i++){let item=arr[i],el=document.createElement('div');el.className='mask-item';const mark=document.createElement('span');mark.style.cssText=`width:9px;height:9px;flex:none;border-radius:3px;background:${COLORS[item.group||'protect']}`;el.append(mark);const label=document.createElement('span');label.textContent=item.id;el.append(label);const btn=document.createElement('button');btn.type='button';btn.textContent=t.removeMask;btn.addEventListener('click',()=>{arr.splice(i,1);toast(t.maskDeleted);refreshMaskOutline();refreshStatus()});el.append(btn);list.append(el)}}}
function pointOfEvent(e){const rect=canvas.getBoundingClientRect(),p=current();return [Math.max(0,Math.min(p.width,(e.clientX-rect.left)/rect.width*p.width)),Math.max(0,Math.min(p.height,(e.clientY-rect.top)/rect.height*p.height))]}
function bindEvents(){document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
$('maskProfile').addEventListener('change',e=>changeProfile(e.target.value));
$('photoFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(f)await loadLocalFile(f);e.target.value=''});
$('uploadBtn').onclick=$('emptyUpload').onclick=()=>$('photoFile').click();$('useDemo').onclick=async()=>{let p=current();if(!p.demo)return;const img=await imageLoad(p.demo);setPhotoForProfile(p.id,img,'demo','clean-master example')};
for(const [id,key] of [['opacity','opacity'],['lighting','lighting'],['scale','scale']])$(id).addEventListener('input',e=>{state[key]=Number(e.target.value);$(id+'Value').textContent=state[key].toFixed(2);scheduleDraw()});
$('protectObjects').onchange=e=>{state.protect=e.target.checked;scheduleDraw()};$('showMasks').onchange=e=>{state.showMasks=e.target.checked;scheduleDraw()};$('inscriptionEnabled').onchange=e=>{state.inscriptionEnabled=e.target.checked;scheduleDraw()};$('inscriptionText').oninput=e=>{state.inscription=e.target.value;scheduleDraw()};
$('compareBtn').addEventListener('pointerdown',()=>{state.compare=true;scheduleDraw()});for(const ev of ['pointerup','pointerleave','pointercancel'])$('compareBtn').addEventListener(ev,()=>{state.compare=false;scheduleDraw()});$('compareBtn').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){state.compare=true;scheduleDraw()}};$('compareBtn').onkeyup=()=>{state.compare=false;scheduleDraw()};
$('exportBtn').onclick=()=>{if(!matched()){toast(tr().chooseFirst);return}let old=state.compare,oldMasks=state.showMasks,oldMode=state.drawMode;state.compare=false;state.showMasks=false;state.drawMode='view';renderNow();try{pngDownload(canvas.toDataURL('image/png'),`synagogue_${state.profileId}_${state.scenario}.png`);toast(tr().saveOK)}catch(e){toast(e.message)}state.compare=old;state.showMasks=oldMasks;state.drawMode=oldMode;scheduleDraw()};
$('drawMode').onchange=e=>{state.drawMode=e.target.value;state.draft=[];if(state.drawMode!=='view'){$('showMasks').checked=true;state.showMasks=true}scheduleDraw()};
$('finishPolygon').onclick=()=>{if(state.draft.length<3){toast(tr().polygon3);return}let p=current(),type=state.drawMode;if(type==='view')return;let item={id:'USER_'+Date.now(),points:state.draft.map(([x,y])=>[Math.round(x),Math.round(y)])};if(type==='protect')p.protected.push(item);else p.masks.push({...item,group:type});state.draft=[];refreshStatus()};$('cancelPolygon').onclick=()=>{state.draft=[];scheduleDraw()};
canvas.addEventListener('pointerdown',e=>{if(!$('advanced').open||!matched())return;if(state.drawMode!=='view'){let xy=pointOfEvent(e);state.draft.push(xy);scheduleDraw();return}if(!state.showMasks)return;let [x,y]=pointOfEvent(e),closest=null,best=16*16;for(let a of [...current().masks,...current().protected])for(let i=0;i<a.points.length;i++){let pt=a.points[i],d=(pt[0]-x)**2+(pt[1]-y)**2;if(d<best){best=d;closest={a,i}}}if(closest){state.editing=closest;canvas.setPointerCapture(e.pointerId);e.preventDefault()}});
canvas.addEventListener('pointermove',e=>{if(!state.editing)return;state.editing.a.points[state.editing.i]=pointOfEvent(e).map(Math.round);scheduleDraw();e.preventDefault()});for(let ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,()=>state.editing=null);
$('saveProject').onclick=()=>{const payload={type:'synagogue-material-studio',version:'1.0',profileId:state.profileId,profiles:Object.fromEntries(Object.entries(profiles).map(([id,p])=>[id,{width:p.width,height:p.height,masks:p.masks,protected:p.protected}])),scenario:state.scenario,materials:state.materials};blobDownload(JSON.stringify(payload,null,2),'synagogue_mask_project.json','application/json');toast(tr().saveOK)};
$('loadProject').onclick=()=>$('projectFile').click();$('projectFile').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.type!=='synagogue-material-studio'||!data.profiles)throw Error('Bad JSON');for(const [id,u] of Object.entries(data.profiles)){if(!profiles[id]||u.width!==profiles[id].width||u.height!==profiles[id].height||!Array.isArray(u.masks)||!Array.isArray(u.protected))continue;let valid=arr=>arr.every(item=>Array.isArray(item.points)&&item.points.length>=3&&item.points.every(pt=>Array.isArray(pt)&&pt.length===2&&pt.every(Number.isFinite)));if(!valid(u.masks)||!valid(u.protected))continue;profiles[id].masks=structuredClone(u.masks);profiles[id].protected=structuredClone(u.protected)}if(data.materials)for(let k of ZONES)if(catalog.some(x=>x.id===data.materials[k]))state.materials[k]=data.materials[k];if(SCENARIOS.includes(data.scenario))state.scenario=data.scenario;renderControls();await changeProfile(profiles[data.profileId]?data.profileId:state.profileId);toast(tr().importOK)}catch(err){toast(tr().badFile)}e.target.value=''};
}
async function boot(){try{const [maskData,products]=window.SMS_DATA ? [window.SMS_DATA.maskData,window.SMS_DATA.catalog] : await Promise.all([fetchJSON('./masks.json'),fetchJSON('./catalog.json')]);profiles=maskData.profiles;catalog=products;const textureResults=await Promise.all(catalog.map(async m=>{try{return [m.id,await imageLoad(m.texturePath)]}catch(e){return [m.id,null]}}));tiles=Object.fromEntries(textureResults);
bindEvents();for(const key of ['opacity','lighting','scale'])$(key+'Value').textContent=state[key].toFixed(2);let language='he';try{language=localStorage.getItem('sms-v1-language')||'he'}catch(e){}setLanguage(language);db=await openDatabase();await changeProfile(maskData.default);ready=true;
// Try supplier previews without blocking initial rendering. Manufacturer imagery may be blocked by CORS.
for(const m of catalog)probeOfficial(m);
}catch(err){console.error(err);warn('Startup error / שגיאת הפעלה: '+err.message)}}
boot();

</script></body></html>
