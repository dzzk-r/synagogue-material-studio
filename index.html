<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="סימולטור חיפוי קירות לבית הכנסת על פי דגמי Kalkir" />
<title>Synagogue Material Studio · Kalkir</title>
<link rel="stylesheet" href="./styles.css" />
<script defer src="./data-part-00.js"></script>
<script defer src="./data-part-01.js"></script>
<script defer src="./data-part-02.js"></script>
<script defer src="./data-part-03.js"></script>
<script defer src="./data-part-04.js"></script>
<script defer src="./data-part-05.js"></script>
<script defer src="./data-part-06.js"></script>
<script defer src="./data-part-07.js"></script>
<script defer src="./data-part-08.js"></script>
<script defer src="./data-part-09.js"></script>
<script defer src="./data-part-10.js"></script>
<script defer src="./data-final.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<header class="site-header">
  <div class="brand"><div class="brand-symbol" aria-hidden="true">▦</div><div><strong>Synagogue Material Studio</strong><small id="brandSub">הדמיית חיפוי קירות</small></div></div>
  <nav class="languages" aria-label="Language"><button type="button" data-lang="he" aria-pressed="true">עברית</button><button type="button" data-lang="en">English</button><button type="button" data-lang="ru">Русский</button></nav>
</header>
<main class="container">
 <section class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="mainTitle"></h1><p id="subtitle"></p></section>
 <div id="errorBox" class="error-box" hidden role="alert"></div>
 <div class="workspace">
  <section class="view-card" aria-label="Preview">
   <div class="card-heading"><strong id="previewTitle"></strong><span id="sceneChip" class="chip"></span></div>
   <div class="scene-stage" id="stage"><canvas id="renderCanvas" width="1536" height="864" aria-label="Rendered room"></canvas><div id="emptyScene" class="empty-scene" hidden><span class="empty-icon">▧</span><b id="emptyTitle"></b><p id="emptyHelp"></p><button type="button" id="emptyUpload" class="primary"></button></div></div>
   <div class="preview-actions"><button type="button" id="compareBtn" class="ghost"></button><button type="button" id="exportBtn" class="primary"></button></div>
   <p id="renderNotice" class="accuracy"></p>
  </section>
  <aside class="controls">
   <section class="panel"><h2><span class="step">01</span><span id="sceneSection"></span></h2><label for="maskProfile" id="maskLabel" class="field-label"></label><select id="maskProfile"></select><div id="maskStats" class="hint"></div><div class="profile-photo"><label id="photoLabel" class="field-label"></label><div class="photo-buttons"><button type="button" id="useDemo" class="secondary"></button><button type="button" id="uploadBtn" class="secondary"></button></div><input id="photoFile" type="file" accept="image/png,image/jpeg,image/webp" hidden/><div id="photoStatus" class="hint"></div></div></section>
   <section class="panel"><h2><span class="step">02</span><span id="scenarioSection"></span></h2><div id="scenarioOptions" class="scenario-grid"></div></section>
   <section class="panel"><h2><span class="step">03</span><span id="materialSection"></span></h2><div id="materialSelectors"></div><div id="productCard" class="product-card"></div></section>
   <section class="panel inscription-panel" id="inscriptionPanel">
    <h2><span class="step">04</span><span id="inscriptionTitle"></span></h2>
    <label class="checkline inscription-toggle"><input type="checkbox" id="inscriptionEnabled" checked/><span id="inscriptionEnabledLabel"></span></label>
    <label class="field-label" for="inscriptionText" id="inscriptionTextLabel"></label>
    <input id="inscriptionText" type="text" dir="auto" value="כיתוב לדוגמה" maxlength="100"/>
    <div class="inscription-grid">
      <div><label class="field-label" for="inscriptionFont" id="inscriptionFontLabel"></label><select id="inscriptionFont"><option value="classic">David / Traditional serif</option><option value="serif">Georgia / Classic serif</option><option value="sans">Arial / Sans-serif</option><option value="book">Frank Ruhl / Book serif</option></select></div>
      <div><label class="field-label" for="inscriptionPattern" id="inscriptionPatternLabel"></label><select id="inscriptionPattern"><option value="gold">Gold / זהב</option><option value="solid">Solid / חלק</option><option value="engraved">Engraved / חריטה</option><option value="outline">Outline / מתאר</option><option value="stone">Stone / אבן</option></select></div>
      <div><label class="field-label" for="inscriptionColor" id="inscriptionColorLabel"></label><input type="color" id="inscriptionColor" value="#b78a38"/></div>
      <div><label class="field-label" for="inscriptionStroke" id="inscriptionStrokeLabel"></label><input type="color" id="inscriptionStroke" value="#503c24"/></div>
    </div>
    <div class="control-line"><label id="inscriptionSizeLabel" for="inscriptionSize"></label><input type="range" id="inscriptionSize" min="18" max="100" value="47" step="1"/><output id="inscriptionSizeValue">47 px</output></div>
    <div class="control-line"><label id="inscriptionWidthLabel" for="inscriptionWidth"></label><input type="range" id="inscriptionWidth" min="35" max="98" value="90" step="1"/><output id="inscriptionWidthValue">90%</output></div>
    <div class="control-line"><label id="inscriptionXLabel" for="inscriptionX"></label><input type="range" id="inscriptionX" min="-220" max="220" value="0" step="2"/><output id="inscriptionXValue">0 px</output></div>
    <div class="control-line"><label id="inscriptionYLabel" for="inscriptionY"></label><input type="range" id="inscriptionY" min="-55" max="55" value="0" step="1"/><output id="inscriptionYValue">0 px</output></div>
    <div class="inscription-actions"><button type="button" id="moveInscription" aria-pressed="false"></button><button type="button" id="resetInscriptionPosition"></button></div>
    <p id="inscriptionHelp" class="hint"></p>
   </section>
   <details class="advanced" id="advanced"><summary id="advancedTitle"></summary><div class="advanced-inner"><div class="control-line"><label id="opacityLabel" for="opacity"></label><input type="range" id="opacity" min="0.3" max="1" step="0.05" value="0.93"/><span id="opacityValue"></span></div><div class="control-line"><label id="lightingLabel" for="lighting"></label><input type="range" id="lighting" min="0" max="0.9" step="0.05" value="0.25"/><span id="lightingValue"></span></div><div class="light-field-controls"><button id="lightMapToggle" type="button" aria-pressed="false">View lighting map</button><button id="lightMapExport" type="button">Export light map PNG</button><p id="lightMapDescription" class="hint"></p></div><div class="control-line"><label id="scaleLabel" for="scale"></label><input type="range" id="scale" min="0.4" max="2.5" step="0.05" value="1"/><span id="scaleValue"></span></div><label class="checkline"><input type="checkbox" id="protectObjects" checked/><span id="protectLabel"></span></label><label class="checkline"><input type="checkbox" id="showMasks"/><span id="showMasksLabel"></span></label>
    <div class="mask-edit"><h3 id="maskEditorTitle"></h3><p id="editorHelp" class="hint"></p>
    <div class="mask-selection"><label id="selectMaskLabel" for="activeMask"></label><select id="activeMask"></select></div>
    <div class="edit-tools"><select id="drawMode"><option value="view" id="drawView"></option><option value="top" id="drawTop"></option><option value="bottom" id="drawBottom"></option><option value="arkTop" id="drawArkTop"></option><option value="arkFace" id="drawArkFace"></option><option value="protect" id="drawProtected"></option></select><button type="button" id="finishPolygon"></button><button type="button" id="cancelPolygon"></button></div>
    <div class="edit-tools mask-operations"><button id="addVertex" type="button"></button><button id="removeVertex" type="button"></button><button id="undoMask" type="button"></button><button id="resetProfileMasks" type="button"></button></div>
    <div class="mask-selection"><label for="maskZoom" id="maskZoomLabel"></label><select id="maskZoom"><option value="1">100%</option><option value="2">200%</option><option value="3">300%</option></select></div>
    <p id="maskActionHelp" class="hint"></p><div id="maskList" class="mask-list"></div></div>
    <div class="save-actions"><button type="button" id="saveProject"></button><button type="button" id="loadProject"></button><input id="projectFile" type="file" accept="application/json,.json" hidden/></div>
   </div></details>
  </aside>
 </div>
 <details class="catalog-section" id="catalogSection"><summary id="catalogTitle"></summary><div id="catalogGrid" class="catalog-grid"></div></details>
 <footer><span id="footerText"></span><a href="https://www.kalkir.co.il/" rel="noopener noreferrer" target="_blank">Kalkir ↗</a> · <a href="https://github.com/dzzk-r/synagogue-material-studio" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
