<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="סימולטור חיפוי קירות לבית הכנסת על פי דגמי Kalkir" />
<title>Synagogue Material Studio · Kalkir</title>
<link rel="stylesheet" href="./styles.css" />
<script defer src="./data-part-00.js"></script>
<script defer src="./data-part-01.js"></script>
<script defer src="./data-part-02.js"></script>
<script defer src="./data-part-03.js"></script>
<script defer src="./data-part-04.js"></script>
<script defer src="./data-part-05.js"></script>
<script defer src="./data-part-06.js"></script>
<script defer src="./data-part-07.js"></script>
<script defer src="./data-part-08.js"></script>
<script defer src="./data-part-09.js"></script>

</head>
<body>
<header class="site-header">
  <div class="brand"><div class="brand-symbol" aria-hidden="true">▦</div><div><strong>Synagogue Material Studio</strong><small id="brandSub">הדמיית חיפוי קירות</small></div></div>
  <nav class="languages" aria-label="Language"><button type="button" data-lang="he" aria-pressed="true">עברית</button><button type="button" data-lang="en">English</button><button type="button" data-lang="ru">Русский</button></nav>
</header>
<main class="container">
 <section class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="mainTitle"></h1><p id="subtitle"></p></section>
 <div id="errorBox" class="error-box" hidden role="alert"></div>
 <div class="workspace">
  <section class="view-card" aria-label="Preview">
   <div class="card-heading"><strong id="previewTitle"></strong><span id="sceneChip" class="chip"></span></div>
   <div class="scene-stage" id="stage"><canvas id="renderCanvas" width="1536" height="864" aria-label="Rendered room"></canvas><div id="emptyScene" class="empty-scene" hidden><span class="empty-icon">▧</span><b id="emptyTitle"></b><p id="emptyHelp"></p><button type="button" id="emptyUpload" class="primary"></button></div></div>
   <div class="preview-actions"><button type="button" id="compareBtn" class="ghost"></button><button type="button" id="exportBtn" class="primary"></button></div>
   <p id="renderNotice" class="accuracy"></p>
  </section>
  <aside class="controls">
   <section class="panel"><h2><span class="step">01</span><span id="sceneSection"></span></h2><label for="maskProfile" id="maskLabel" class="field-label"></label><select id="maskProfile"></select><div id="maskStats" class="hint"></div><div class="profile-photo"><label id="photoLabel" class="field-label"></label><div class="photo-buttons"><button type="button" id="useDemo" class="secondary"></button><button type="button" id="uploadBtn" class="secondary"></button></div><input id="photoFile" type="file" accept="image/png,image/jpeg,image/webp" hidden/><div id="photoStatus" class="hint"></div></div></section>
   <section class="panel"><h2><span class="step">02</span><span id="scenarioSection"></span></h2><div id="scenarioOptions" class="scenario-grid"></div></section>
   <section class="panel"><h2><span class="step">03</span><span id="materialSection"></span></h2><div id="materialSelectors"></div><div id="productCard" class="product-card"></div></section>
   <section class="panel inscription-panel" id="inscriptionPanel">
    <h2><span class="step">04</span><span id="inscriptionTitle"></span></h2>
    <label class="checkline inscription-toggle"><input type="checkbox" id="inscriptionEnabled" checked/><span id="inscriptionEnabledLabel"></span></label>
    <label class="field-label" for="inscriptionText" id="inscriptionTextLabel"></label>
    <input id="inscriptionText" type="text" dir="auto" value="כיתוב לדוגמה" maxlength="100"/>
    <div class="inscription-grid">
      <div><label class="field-label" for="inscriptionFont" id="inscriptionFontLabel"></label><select id="inscriptionFont"><option value="classic">David / Traditional serif</option><option value="serif">Georgia / Classic serif</option><option value="sans">Arial / Sans-serif</option><option value="book">Frank Ruhl / Book serif</option></select></div>
      <div><label class="field-label" for="inscriptionPattern" id="inscriptionPatternLabel"></label><select id="inscriptionPattern"><option value="gold">Gold / זהב</option><option value="solid">Solid / חלק</option><option value="engraved">Engraved / חריטה</option><option value="outline">Outline / מתאר</option><option value="stone">Stone / אבן</option></select></div>
      <div><label class="field-label" for="inscriptionColor" id="inscriptionColorLabel"></label><input type="color" id="inscriptionColor" value="#b78a38"/></div>
      <div><label class="field-label" for="inscriptionStroke" id="inscriptionStrokeLabel"></label><input type="color" id="inscriptionStroke" value="#503c24"/></div>
    </div>
    <div class="control-line"><label id="inscriptionSizeLabel" for="inscriptionSize"></label><input type="range" id="inscriptionSize" min="18" max="100" value="47" step="1"/><output id="inscriptionSizeValue">47 px</output></div>
    <div class="control-line"><label id="inscriptionWidthLabel" for="inscriptionWidth"></label><input type="range" id="inscriptionWidth" min="35" max="98" value="90" step="1"/><output id="inscriptionWidthValue">90%</output></div>
    <div class="control-line"><label id="inscriptionXLabel" for="inscriptionX"></label><input type="range" id="inscriptionX" min="-220" max="220" value="0" step="2"/><output id="inscriptionXValue">0 px</output></div>
    <div class="control-line"><label id="inscriptionYLabel" for="inscriptionY"></label><input type="range" id="inscriptionY" min="-55" max="55" value="0" step="1"/><output id="inscriptionYValue">0 px</output></div>
    <div class="inscription-actions"><button type="button" id="moveInscription" aria-pressed="false"></button><button type="button" id="resetInscriptionPosition"></button></div>
    <p id="inscriptionHelp" class="hint"></p>
   </section>
   <details class="advanced" id="advanced"><summary id="advancedTitle"></summary><div class="advanced-inner"><div class="control-line"><label id="opacityLabel" for="opacity"></label><input type="range" id="opacity" min="0.3" max="1" step="0.05" value="0.93"/><span id="opacityValue"></span></div><div class="control-line"><label id="lightingLabel" for="lighting"></label><input type="range" id="lighting" min="0" max="0.9" step="0.05" value="0.25"/><span id="lightingValue"></span></div><div class="light-field-controls"><button id="lightMapToggle" type="button" aria-pressed="false">View lighting map</button><button id="lightMapExport" type="button">Export lighting PNG</button><p id="lightMapDescription" class="hint"></p></div><div class="control-line"><label id="scaleLabel" for="scale"></label><input type="range" id="scale" min="0.4" max="2.5" step="0.05" value="1"/><span id="scaleValue"></span></div><label class="checkline"><input type="checkbox" id="protectObjects" checked/><span id="protectLabel"></span></label><label class="checkline"><input type="checkbox" id="showMasks"/><span id="showMasksLabel"></span></label>
    <div class="mask-edit"><h3 id="maskEditorTitle"></h3><p id="editorHelp" class="hint"></p>
    <div class="mask-selection"><label id="selectMaskLabel" for="activeMask"></label><select id="activeMask"></select></div>
    <div class="edit-tools"><select id="drawMode"><option value="view" id="drawView"></option><option value="top" id="drawTop"></option><option value="bottom" id="drawBottom"></option><option value="arkTop" id="drawArkTop"></option><option value="arkFace" id="drawArkFace"></option><option value="protect" id="drawProtected"></option></select><button type="button" id="finishPolygon"></button><button type="button" id="cancelPolygon"></button></div>
    <div class="edit-tools mask-operations"><button id="addVertex" type="button"></button><button id="removeVertex" type="button"></button><button id="undoMask" type="button"></button><button id="resetProfileMasks" type="button"></button></div>
    <div class="mask-selection"><label for="maskZoom" id="maskZoomLabel"></label><select id="maskZoom"><option value="1">100%</option><option value="2">200%</option><option value="3">300%</option></select></div>
    <p id="maskActionHelp" class="hint"></p><div id="maskList" class="mask-list"></div></div>
    <div class="save-actions"><button type="button" id="saveProject"></button><button type="button" id="loadProject"></button><input id="projectFile" type="file" accept="application/json,.json" hidden/></div>
   </div></details>
  </aside>
 </div>
 <details class="catalog-section" id="catalogSection"><summary id="catalogTitle"></summary><div id="catalogGrid" class="catalog-grid"></div></details>
 <footer><span id="footerText"></span><a href="https://www.kalkir.co.il/" rel="noopener noreferrer" target="_blank">Kalkir ↗</a> · <a href="https://github.com/dzzk-r/synagogue-material-studio" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

 .sms-tab{font-size:12px;white-space:nowrap;padding:10px 12px;flex:none;border-radius:8px}.sms-tab[aria-selected=true]{background:#f0ce8f;color:#182832;font-weight:750}
 .sms-tab-content{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}.sms-pane{padding:13px;display:none}.sms-pane.active{display:block}
 .sms-pane>.panel{margin-bottom:12px}.sms-pane>.advanced{border:none;background:transparent}.sms-pane>.advanced summary{display:none!important}.sms-pane>.advanced-inner{padding:0}.sms-pane .mask-edit{border:0;margin:0;padding:0}
 .sms-supplier-browser{border:1px solid #52647a;padding:13px;border-radius:12px;background:#1b3040;margin-bottom:14px}
 .sms-source-pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
 .sms-source-field{display:flex;min-width:0;flex-direction:column;gap:5px;font-size:12px;color:#c7d5db}
 .sms-source-field select{width:100%;font-size:12px;padding:10px 7px}.sms-source-field select:disabled{opacity:.9}
 .sms-collection-links{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 13px}
 .sms-collection-links a{font-size:11px;padding:7px 9px;border:1px solid #516779;border-radius:7px;color:#dfe9ef;text-decoration:none}
 .sms-collection-links a.selected{color:#1c2a34;background:#f0ce8f;border-color:#f0ce8f}
 .sms-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .sms-gallery-item{border:1px solid #496174;border-radius:9px;overflow:hidden;background:#20313e;min-width:0;padding:0;display:block;text-align:start}
 .sms-gallery-item.selected{border-color:#f0ce8f;outline:1px solid #f0ce8f}
 .sms-gallery-item img{display:block;width:100%;height:76px;object-fit:cover}
 .sms-gallery-item span{font-size:11px;display:block;padding:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .sms-gallery-item small{font-size:10px;color:#bcd0db;padding:0 7px 8px;display:block}
 .sms-show-all{display:block;font-size:12px;margin-top:12px}.sms-note,.sms-caution{font-size:12px;color:#b8c7cf;line-height:1.6}
 .sms-caution{border-inline-start:3px solid #f0ce8f;background:#253541;padding:12px;border-radius:6px}
 .sms-layer-toggle{display:flex;align-items:center;gap:8px;padding:9px;border-bottom:1px solid #35485a;cursor:pointer}.sms-layer-toggle input{width:16px;height:16px}
 .sms-layer-toggle span{font-size:13px}
 .sms-inspector{border-top:1px solid #385064;margin-top:14px;padding-top:10px}.sms-inspector h3{font-size:12px;font-weight:650;margin:2px 0 9px}
 .sms-preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sms-diagnostic{border:1px solid #40566b;padding:8px;border-radius:9px;min-width:0}
 .sms-diagnostic span{font-size:11px;color:#bdcbd3;display:block;margin-bottom:6px}.sms-diagnostic canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#253543;border-radius:6px}
 .sms-inspector-note{font-size:11px;color:#a9bcc8;margin-bottom:0}
 @media(max-width:500px){.sms-source-pickers{grid-template-columns:1fr}.sms-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
 `;
 // Use existing core renderer and light extractor for factual miniatures, without rendering new synthetic content.
 const originalRender=renderNow;
 renderNow=function(){originalRender();drawDiagnosticThumbs();};
 // Must only edit a mask while the Masks tab is active.
 activateTab('materials');
 const originalSetLanguage=setLanguage;
 setLanguage=function(code){originalSetLanguage(code);localizeWorkspace()};
 const originalRefresh=refreshStatus;
 refreshStatus=function(){originalRefresh();refreshPicker();};
 localizeWorkspace();refreshPicker();renderCollectionLinks();renderGallery();scheduleDraw();
}
function activateTab(name){
 tab=name;
 for(const node of document.querySelectorAll('.sms-tab')) {const active=node.dataset.tab===name;node.setAttribute('aria-selected',String(active));node.tabIndex=active?0:-1;}
 for(const pane of document.querySelectorAll('.sms-pane'))pane.classList.toggle('active',pane.dataset.pane===name);
 const advanced=document.getElementById('advanced');advanced.open=name==='masks';
 if(name!=='masks'){state.showMasks=false;document.getElementById('showMasks').checked=false;state.selectedMask=null;state.drawMode='view';document.getElementById('drawMode').value='view'}
 if(name==='masks'){state.showMasks=true;document.getElementById('showMasks').checked=true}
 refreshMaskEditing();scheduleDraw();
}
function localizeWorkspace(){
 const t=labels();for(const btn of document.querySelectorAll('.sms-tab'))btn.textContent=t[btn.dataset.tab];
 document.querySelectorAll('[data-source-label]').forEach(e=>e.textContent=t[e.dataset.sourceLabel]);
 document.querySelectorAll('[data-layer-name]').forEach(e=>e.textContent=t[e.dataset.layerName]);
 document.querySelectorAll('[data-diagnostic]').forEach(e=>e.textContent=t[e.dataset.diagnostic]);
 document.getElementById('smsGalleryTitle').textContent=t.chooseModel;
 document.getElementById('smsAllModels').textContent=t.openAll;
 document.getElementById('smsInspectorTitle').textContent=t.inspector;
 document.getElementById('smsInspectorNote').textContent=t.lightingNote;
 document.getElementById('smsCategoryStatus').textContent=catSelect.value==='jerusalem'?t.compatible:t.external;
 const sl=supplierSelect.options[0];sl.textContent=t.supplier;
 for(const opt of zoneSelect.options) opt.textContent=t[opt.value==='top'?'wall':opt.value==='bottom'?'lower':opt.value==='arkTop'?'head':'face'];
 setLayerSupport();renderCollectionLinks();
}
function setLayerSupport(){
 layerExplain.textContent=labels().notIsolated;
 for(const inp of document.querySelectorAll('[data-object-layer]')){
   // This checkbox controls protection/restoration of an original patch, not genuine object removal.
   inp.title=labels().notIsolated;
 }
}
function refreshPicker(){
 if(!zoneSelect)return;
 const enabled=groupNames();if(enabled.length&&!enabled.includes(zoneSelect.value))zoneSelect.value=enabled[0];
 const val=zoneSelect.value||'top';modelSelect.replaceChildren();for(const m of catalog)modelSelect.add(new Option(m.he,m.id));
 modelSelect.value=state.materials[val]||catalog[0]?.id||'yerushalmi';
 document.getElementById('smsCategoryStatus').textContent=catSelect.value==='jerusalem'?labels().compatible:labels().external;
}
function renderCollectionLinks(){
 if(!collectionLinks)return;collectionLinks.replaceChildren();for(const [key,he,en,url] of categories){const a=el('a','',collectionLinks);a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=(document.documentElement.lang==='he'?he:en)+' ↗';a.classList.toggle('selected',key===catSelect.value);a.title=url;}
}
function renderGallery(){
 const gallery=document.getElementById('smsGallery');if(!gallery)return;gallery.replaceChildren();
 // These 10 linked models are sourced from the supplier's Jerusalem stone category.
 if(catSelect.value!=='jerusalem' && !(externalExamples[catSelect.value]||[]).length)return;
 const selected=state.materials[zoneSelect.value];for(const m of (catSelect.value==='jerusalem'?catalog:(externalExamples[catSelect.value]||[]))){const card=el('button','sms-gallery-item',gallery);card.type='button';card.classList.toggle('selected',selected===m.id);card.title=m.he+' / '+m.url;const im=el('img','',card);im.loading='lazy';im.referrerPolicy='no-referrer';im.alt=m.he;im.src=m.texturePath||m.photo;const originalPhoto=new Image();originalPhoto.onload=()=>{if(im.isConnected)im.src=m.photo};originalPhoto.src=m.photo;const name=el('span','',card);name.textContent=m.he;const meta=el('small','',card);meta.textContent=(m.coverage_m2||'?')+' m² · '+(m.dimensions||'');card.onclick=()=>{if(m.id){modelSelect.value=m.id;modelSelect.dispatchEvent(new Event('change'))}else window.open(m.url,'_blank','noopener,noreferrer')};}
}
function drawDiagnosticThumbs(){
 if(!photoThumb||!lightThumb||typeof photo!=='function')return;
 const original=photo(),p=current(),a=photoThumb.getContext('2d'),b=lightThumb.getContext('2d');
 a.clearRect(0,0,photoThumb.width,photoThumb.height);b.clearRect(0,0,lightThumb.width,lightThumb.height);
 if(original) a.drawImage(original,0,0,photoThumb.width,photoThumb.height);
 const map=getLightMap();if(map)b.drawImage(map,0,0,lightThumb.width,lightThumb.height);
}
onReady();
})();
